[project]
name = "accesspay-mock-bank"
version = "0.1.0"
description = "Mock bank backend for the AccessPay demo. Simulated funds only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mock_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
