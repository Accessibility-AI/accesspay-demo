org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AccessAI service base URL (the live Gemini-backed service). Pass -PaccessaiUrl= (empty) for the SDK's
# offline LocalRulesBackend (keyword matching, unsigned tokens; the mock bank must then run with ALLOW_DEV_TOKENS=true).
accessaiUrl=https://accessai-server-gemini.fly.dev
# Mock bank base URL. Empty = the simulated bank inside the app (works on any phone, nothing to run).
# To use mock-bank/ instead: -PmockBankUrl=http://10.0.2.2:8000 from the emulator, or on a USB device
# `adb reverse tcp:8000 tcp:8000` and -PmockBankUrl=http://localhost:8000
mockBankUrl=
